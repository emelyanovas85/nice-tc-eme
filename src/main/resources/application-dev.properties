# Настройки для разработки (БЕЗ THYMELEAF)
spring.profiles.active=dev

# Включаем подробное логирование
logging.level.root=INFO
logging.level.com.testsystem=DEBUG

# Отключаем кеширование статических ресурсов для разработки
spring.web.resources.cache.cachecontrol.max-age=0

# Включаем DevTools для автоматической перезагрузки
spring.devtools.restart.enabled=true

# Тестовые настройки для внешних сервисов
jira.base-url=http://localhost:8080/mock/jira
ai.service.url=http://localhost:8080/mock/ai

# Показываем подробные ошибки в development
server.error.include-stacktrace=always
