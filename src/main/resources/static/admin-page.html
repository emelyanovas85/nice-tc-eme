<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ Админка - Single File Test Service</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: linear-gradient(135deg, #667eea, #764ba2); }
        .header {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .header h1 { margin: 0; font-size: 36px; }
        .header p { margin: 15px 0 0 0; opacity: 0.9; font-size: 18px; }
        .container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px;
        }
        .section {
            background: rgba(255,255,255,0.95);
            margin-bottom: 30px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .section h3 {
            margin-top: 0;
            color: #495057;
            border-bottom: 4px solid #28a745;
            padding-bottom: 15px;
            display: flex;
            align-items: center;
            font-size: 24px;
        }
        .section h3::before {
            margin-right: 15px;
            font-size: 28px;
        }
        .section:nth-child(1) h3::before { content: "➕"; }
        .section:nth-child(2) h3::before { content: "⚙️"; }
        .section:nth-child(3) h3::before { content: "📝"; }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #495057;
            font-size: 16px;
        }
        input, select, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #28a745;
            box-shadow: 0 0 15px rgba(40,167,69,0.3);
            transform: scale(1.02);
        }
        textarea {
            height: 150px;
            resize: vertical;
            font-family: 'Courier New', monospace;
        }
        .btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(40,167,69,0.3);
        }
        .btn:hover { 
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(40,167,69,0.4);
        }
        .btn-danger { 
            background: linear-gradient(135deg, #dc3545, #c82333);
            box-shadow: 0 5px 20px rgba(220,53,69,0.3);
        }
        .btn-danger:hover { 
            box-shadow: 0 8px 25px rgba(220,53,69,0.4);
        }
        .btn-small {
            padding: 10px 20px;
            font-size: 14px;
        }
        .config-item {
            background: linear-gradient(135deg, rgba(248,249,250,0.9), rgba(233,236,239,0.9));
            border: 2px solid #dee2e6;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        .config-item:hover {
            border-color: #28a745;
            box-shadow: 0 8px 25px rgba(40,167,69,0.2);
            transform: translateY(-5px);
        }
        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .config-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .tag {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,123,255,0.3);
        }
        .data-fields {
            color: #6c757d;
            font-size: 14px;
            margin-top: 15px;
            font-style: italic;
        }
        .prompt-text {
            background: linear-gradient(135deg, #f1f3f4, #e9ecef);
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin: 15px 0;
            border-left: 5px solid #28a745;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .config-header { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
        .empty-state {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 50px 20px;
            font-size: 18px;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #6c757d;
            font-size: 16px;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: bold;
        }
        .back-link:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <a href="search-page.html" class="back-link">⬅️ Назад к поиску</a>

    <div class="header">
        <h1>⚙️ Админка Test Service</h1>
        <p>Управление настройками элементов тестирования и AI промптами</p>
        <p style="font-size: 14px; opacity: 0.7;">Single File Test Service - Все компоненты в Program.java</p>
    </div>

    <div class="container">
        <div class="section">
            <h3>Добавить новую конфигурацию</h3>
            <form id="configForm">
                <div class="grid">
                    <div class="form-group">
                        <label for="itemId">🆔 ID элемента:</label>
                        <input type="text" id="itemId" required placeholder="например: details_custom">
                    </div>

                    <div class="form-group">
                        <label for="tabName">📂 Вкладка:</label>
                        <select id="tabName" required>
                            <option value="">Выберите вкладку</option>
                            <option value="details">📋 Подробнее</option>
                            <option value="steps">🔄 Шаги</option>
                            <option value="executions">▶️ Выполнения</option>
                            <option value="attachments">📎 Вложения</option>
                            <option value="history">📈 История</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="configName">📝 Название:</label>
                    <input type="text" id="configName" required placeholder="Название проверки">
                </div>

                <div class="form-group">
                    <label for="prompt">🤖 AI Промпт:</label>
                    <textarea id="prompt" required placeholder="Промпт для AI модели. Используйте {{field}} для подстановки данных"></textarea>
                </div>

                <div class="form-group">
                    <label for="dataFields">🏷️ Поля данных (через запятую):</label>
                    <input type="text" id="dataFields" placeholder="objective, name, steps">
                </div>

                <button type="submit" class="btn">➕ Добавить конфигурацию</button>
            </form>
        </div>

        <div class="section">
            <h3>Текущие конфигурации</h3>
            <div id="configList">
                <div class="loading">🔄 Загрузка конфигураций...</div>
            </div>
        </div>

        <div class="section">
            <h3>Шаблоны промптов</h3>
            <div id="promptTemplates">
                <div class="loading">🔄 Загрузка шаблонов...</div>
            </div>
        </div>
    </div>

    <script>
        // Load configurations on page load
        loadConfigs();
        loadPromptTemplates();

        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            createConfig();
        });

        function createConfig() {
            const config = {
                itemId: document.getElementById('itemId').value,
                tabName: document.getElementById('tabName').value,
                name: document.getElementById('configName').value,
                prompt: document.getElementById('prompt').value,
                dataFields: document.getElementById('dataFields').value
                    .split(',')
                    .map(s => s.trim())
                    .filter(s => s)
            };

            console.log('📝 Creating new config:', config);

            fetch('/api/admin/items/config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(config)
            })
            .then(response => response.json())
            .then(data => {
                alert('✅ Конфигурация создана успешно!');
                document.getElementById('configForm').reset();
                loadConfigs();
            })
            .catch(error => {
                console.error('❌ Error:', error);
                alert('❌ Ошибка при создании конфигурации: ' + error.message);
            });
        }

        function loadConfigs() {
            fetch('/api/admin/items/configs')
                .then(response => response.json())
                .then(configs => {
                    console.log('📋 Loaded configs:', configs);
                    const container = document.getElementById('configList');
                    container.innerHTML = '';

                    if (configs.length === 0) {
                        container.innerHTML = '<div class="empty-state">📭 Конфигурации не найдены</div>';
                        return;
                    }

                    configs.forEach((config, index) => {
                        const item = document.createElement('div');
                        item.className = 'config-item';

                        const tabEmojis = {
                            'details': '📋',
                            'steps': '🔄', 
                            'executions': '▶️',
                            'attachments': '📎',
                            'history': '📈'
                        };

                        item.innerHTML = \`
                            <div class="config-header">
                                <div class="config-title">
                                    <strong>\${config.name}</strong>
                                    <span class="tag">\${tabEmojis[config.tabName] || '📄'} \${config.tabName}</span>
                                </div>
                                <div>
                                    <button class="btn btn-danger btn-small" onclick="deleteConfig('\${config.itemId}')">🗑️ Удалить</button>
                                </div>
                            </div>
                            <div><strong>🆔 ID:</strong> \${config.itemId}</div>
                            <div class="prompt-text">\${config.prompt}</div>
                            <div class="data-fields">
                                <strong>🏷️ Поля данных:</strong> 
                                \${config.dataFields && config.dataFields.length > 0 ? 
                                    config.dataFields.join(', ') : 'Нет'}
                            </div>
                        \`;
                        container.appendChild(item);

                        // Animation
                        setTimeout(() => {
                            item.style.opacity = '1';
                            item.style.transform = 'translateY(0)';
                        }, index * 100);
                    });
                })
                .catch(error => {
                    console.error('❌ Error loading configs:', error);
                    document.getElementById('configList').innerHTML = 
                        '<div class="empty-state">❌ Ошибка загрузки конфигураций</div>';
                });
        }

        function loadPromptTemplates() {
            fetch('/api/admin/prompts/templates')
                .then(response => response.json())
                .then(templates => {
                    console.log('📝 Loaded templates:', templates);
                    const container = document.getElementById('promptTemplates');
                    container.innerHTML = '';

                    templates.forEach((template, index) => {
                        const item = document.createElement('div');
                        item.className = 'config-item';
                        item.innerHTML = \`
                            <div class="config-header">
                                <div class="config-title">
                                    <strong>📝 \${template.name}</strong>
                                </div>
                                <button class="btn btn-small" onclick="useTemplate(\\`\${template.template}\\`)">
                                    📋 Использовать
                                </button>
                            </div>
                            <div class="prompt-text">\${template.template}</div>
                        \`;
                        container.appendChild(item);

                        // Animation
                        setTimeout(() => {
                            item.style.opacity = '1';
                            item.style.transform = 'translateY(0)';
                        }, index * 100);
                    });
                })
                .catch(error => {
                    console.error('❌ Error loading templates:', error);
                    document.getElementById('promptTemplates').innerHTML = 
                        '<div class="empty-state">❌ Ошибка загрузки шаблонов</div>';
                });
        }

        function useTemplate(template) {
            document.getElementById('prompt').value = template;
            document.getElementById('prompt').focus();
            document.getElementById('configForm').scrollIntoView({ behavior: 'smooth' });
        }

        function deleteConfig(itemId) {
            if (confirm('🗑️ Вы уверены, что хотите удалить эту конфигурацию?')) {
                console.log('🗑️ Deleting config:', itemId);
                fetch(\`/api/admin/items/config/\${itemId}\`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('✅ Конфигурация удалена!');
                        loadConfigs();
                    } else {
                        alert('❌ Ошибка при удалении');
                    }
                })
                .catch(error => {
                    console.error('❌ Error:', error);
                    alert('❌ Ошибка при удалении: ' + error.message);
                });
            }
        }

        console.log('🚀 Single File Test Service - Admin Page Loaded');
    </script>
</body>
</html>
