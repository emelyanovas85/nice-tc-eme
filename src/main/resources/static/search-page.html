<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Поиск тестов - Single File Test Service</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #007bff; text-align: center; margin-bottom: 30px; font-size: 32px; }
        .search-box { margin: 30px 0; text-align: center; }
        #testIdInput { width: 400px; padding: 15px; font-size: 18px; border: 2px solid #dee2e6; border-radius: 8px; }
        #testIdInput:focus { border-color: #007bff; outline: none; box-shadow: 0 0 10px rgba(0,123,255,0.3); }
        #searchBtn { padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-left: 15px; }
        #searchBtn:hover { background: #0056b3; transform: translateY(-2px); }
        .history { margin-top: 40px; }
        .history h3 { color: #495057; border-bottom: 3px solid #007bff; padding-bottom: 10px; }
        .history-item { 
            background: linear-gradient(135deg, #f8f9fa, #e9ecef); 
            padding: 15px; 
            margin: 10px 0; 
            cursor: pointer;
            border-left: 5px solid #007bff;
            border-radius: 0 8px 8px 0;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }
        .history-item:hover { 
            background: linear-gradient(135deg, #e9ecef, #dee2e6); 
            transform: translateX(10px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .history-item::before { content: "📊"; margin-right: 10px; font-size: 20px; }
        .empty-history { text-align: center; color: #6c757d; font-style: italic; padding: 30px; }
        .footer { text-align: center; margin-top: 40px; color: #6c757d; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Поиск тестов</h1>
        <p style="text-align: center; color: #6c757d; font-size: 16px;">Single File Test Service - Все компоненты в одном классе Program.java</p>

        <div class="search-box">
            <input type="text" id="testIdInput" placeholder="Введите ID теста (например, T777)" autocomplete="off">
            <button id="searchBtn">🚀 Перейти к тесту</button>
        </div>

        <div class="history">
            <h3>📋 История поиска</h3>
            <div id="historyContainer">
                <div class="empty-history">История поиска пуста. Начните поиск тестов!</div>
            </div>
        </div>

        <div class="footer">
            <p>💡 <strong>Администрирование:</strong> <a href="admin-page.html">Перейти в админку</a></p>
            <p>🔗 <strong>SSE поток:</strong> <a href="/api/sse/stream" target="_blank">Открыть поток обновлений</a></p>
        </div>
    </div>

    <script>
        // SSE connection for real-time updates
        const eventSource = new EventSource('/api/sse/stream');

        eventSource.addEventListener('history_updated', function(event) {
            console.log('📨 History update received:', event.data);
            const data = JSON.parse(event.data);
            updateHistory(data.data);
        });

        // Load initial history
        fetch('/api/history')
            .then(response => response.json())
            .then(history => updateHistory(history))
            .catch(error => {
                console.error('❌ Error loading history:', error);
                showError('Не удалось загрузить историю');
            });

        function updateHistory(historyItems) {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            if (historyItems && historyItems.length > 0) {
                historyItems.forEach((testId, index) => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = \`<strong>\${testId}</strong> <small style="color: #6c757d; margin-left: 10px;">добавлен недавно</small>\`;
                    item.onclick = () => navigateToTest(testId);
                    container.appendChild(item);

                    // Анимация появления
                    setTimeout(() => {
                        item.style.opacity = '1';
                        item.style.transform = 'translateX(0)';
                    }, index * 100);
                });
            } else {
                container.innerHTML = '<div class="empty-history">История поиска пуста. Начните поиск тестов!</div>';
            }
        }

        function navigateToTest(testId, version = 'latest') {
            console.log('🚀 Navigating to test:', testId);
            // Add to history via API
            fetch(\`/api/test/\${testId}/access\`, { method: 'POST' })
                .then(() => {
                    window.location.href = \`test-details.html?testId=\${testId}&version=\${version}\`;
                })
                .catch(error => {
                    console.error('❌ Error accessing test:', error);
                    // Navigate anyway
                    window.location.href = \`test-details.html?testId=\${testId}&version=\${version}\`;
                });
        }

        function showError(message) {
            const container = document.getElementById('historyContainer');
            container.innerHTML = \`<div style="color: #dc3545; text-align: center; padding: 20px;">❌ \${message}</div>\`;
        }

        document.getElementById('searchBtn').onclick = function() {
            const testId = document.getElementById('testIdInput').value.trim();
            if (testId) {
                navigateToTest(testId);
            } else {
                alert('⚠️ Пожалуйста, введите ID теста');
            }
        };

        // Enter key support
        document.getElementById('testIdInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        });

        // Handle SSE connection
        eventSource.onopen = function(event) {
            console.log('✅ SSE connection established');
        };

        eventSource.onerror = function(event) {
            console.error('❌ SSE connection error:', event);
        };

        console.log('🚀 Single File Test Service - Search Page Loaded');
    </script>
</body>
</html>
