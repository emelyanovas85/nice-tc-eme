<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Search</title>
    <link rel="stylesheet" href="css/banner.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            width: 400px;
        }
        .input-wrapper {
            position: relative;
        }
        input {
            width: 100%;
            padding: 12px;
            padding-right: 40px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .loader {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        .loader.active {
            display: block;
        }
        @keyframes spin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }
        .message {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }
        .error {
            color: #f44336;
        }
        .success {
            color: #4CAF50;
        }
        .autocomplete {
            position: relative;
            margin-top: 5px;
        }
        .autocomplete-items {
            border: 1px solid #ccc;
            border-top: none;
            background: white;
            max-height: 200px;
            overflow-y: auto;
        }
        .autocomplete-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .autocomplete-item:hover {
            background: #f0f0f0;
        }
        .history {
            margin-top: 20px;
            text-align: left;
        }
        .history-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .history-item {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-top: none;
            border-left: none;
            border-right: none;
            border-radius: 4px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .history-item:hover {
            background: #f0f0f0;
        }
        .history-empty {
            font-size: 14px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Баннер -->
    <div id="topBanner">
        <div class="banner-content">
            <div class="banner-text" id="bannerText"></div>
            <button class="banner-close" onclick="hideBanner()" aria-label="Закрыть">&times;</button>
        </div>
    </div>

    <!-- Контент страницы -->
    <div class="container">
        <div class="input-wrapper">
            <input type="text" id="searchInput" placeholder="Введите ID теста (XXXXX-T777) или прогона (XXXXX-C777)">
            <div class="loader" id="loader"></div>
        </div>
        <div class="autocomplete" id="autocomplete"></div>
        <div class="message" id="message"></div>

        <div class="history">
            <div id="historyList"></div>
        </div>
    </div>

    <script src="api/jira.js"></script>
    <script src="js/banner.js"></script>
    <script src="js/scheduler.js"></script>
    <script>
        // Глобальное состояние и DOM элементы
        const input = document.getElementById('searchInput');
        const message = document.getElementById('message');
        const autocomplete = document.getElementById('autocomplete');
        const loader = document.getElementById('loader');
        const historyList = document.getElementById('historyList');

        let versions = [];
        let currentType = null;
        let currentId = null;
        let userEnteredVersion = false;

        // Кэш результатов запросов
        const cache = {
            tests: {}, // { "ASDCO-T777": [...versions] }
            runs: {}   // { "ASDCO-C777": [...runData] }
        };

        // Счетчик активных запросов для управления индикатором
        let activeRequests = 0;

        // Утилиты для работы с индикатором загрузки
        function showLoader() {
            activeRequests++;
            loader.classList.add('active');
        }

        function hideLoader() {
            activeRequests--;
            if (activeRequests <= 0) {
                activeRequests = 0;
                loader.classList.remove('active');
            }
        }

        function resetState() {
            versions = [];
            currentType = null;
            currentId = null;
        }

        // API запросы
        async function fetchTestVersions(testKey) {
            // Проверяем кэш
            if (cache.tests[testKey]) {
                versions = cache.tests[testKey];
                return;
            }

            try {
                showLoader();
                message.textContent = 'Загрузка...';
                message.className = 'message';
                const data = await Jira.getAllVersions(testKey);

                // Сохраняем в кэш
                cache.tests[testKey] = data;
                versions = data;

                if (versions.length === 0) {
                    message.textContent = 'Тест не найден';
                    message.className = 'message error';
                } else {
                    message.textContent = '';
                }
            } catch (error) {
                message.textContent = 'Ошибка при загрузке данных';
                message.className = 'message error';
                versions = [];
                console.error('Ошибка при загрузке данных', error);
            } finally {
                hideLoader();
            }
        }

        async function fetchRunVersions(runId) {
            // Проверяем кэш
            if (cache.runs[runId]) {
                const runData = cache.runs[runId];
                if (runData.length > 0) {
                    message.textContent = 'Нажмите Enter для перехода';
                    message.className = 'message success';
                }
                return;
            }

            try {
                showLoader();
                message.textContent = 'Загрузка...';
                message.className = 'message';
                const runData = await Jira.searchRun(runId);

                // Сохраняем в кэш
                cache.runs[runId] = runData.map(v => (v.name = 7) && o);

                if (runData.length === 0) {
                    message.textContent = 'Прогон не найден';
                    message.className = 'message error';
                } else {
                    message.textContent = 'Нажмите Enter для перехода';
                    message.className = 'message success';
                }
            } catch (error) {
                message.textContent = 'Ошибка при загрузке данных';
                message.className = 'message error';
                console.error('Ошибка при загрузке данных', error);
            } finally {
                hideLoader();
            }
        }

        // Обработчики ввода
        async function handleInput(e) {
            const value = e.target.value?.trim().toUpperCase();
            message.textContent = '';
            message.className = 'message';
            autocomplete.innerHTML = '';
            userEnteredVersion = false;

            if (!value) {
                resetState();
                return;
            }

            const testWithVersionMatch = value.match(/^(\w+-T\d+)\s+\(?(\d+)\.?0?\)?$/);
            const testMatch = value.match(/^\w+-T\d+$/);
            const runMatch = value.match(/^\w+-C\d+$/);

            if (testWithVersionMatch) {
                await handleTestWithVersion(testWithVersionMatch);

            } else if (testMatch) {
                await handleTest(value);

            } else if (runMatch) {
                await handleRun(value);
            }
        }

        async function handleTestWithVersion(match) {
            const testKey = match[1];
            const ver = match[2];
            userEnteredVersion = true;

            if (currentId !== testKey) {
                await fetchTestVersions(testKey);
                if (versions.length) { // если версии получены
                    currentId = testKey;
                    currentType = 'test';
                }
            } else {
                // Используем кэшированные данные
                versions = cache.tests[testKey] || [];
            }

            if (versions.length > 0) {
                const version = versions.find(v => v.version === ver);
                if (version) {
                    message.textContent = 'Нажмите Enter для перехода';
                    message.className = 'message success';

                } else { // введенная пользователем версия не найдена в списке версий
                    showAutocomplete();
                    message.textContent = 'Версия не найдена. Выберите из списка';
                    message.className = 'message error';
                }
            }
        }

        async function handleTest(testKey) {
            if (currentId !== testKey) {
                await fetchTestVersions(testKey);
                if (versions.length) { // если версии получены
                    currentId = testKey;
                    currentType = 'test';
                }
            } else {
                // Используем кэшированные данные
                versions = cache.tests[testKey] || [];
            }

//            if (!userEnteredVersion && versions.length > 0) {
                showAutocomplete();
//            }
        }

        async function handleRun(runId) {
            if (currentId !== runId) {
                currentId = runId;
                currentType = 'run';
                await fetchRunVersions(runId);
            } else {
                // Используем кэшированные данные
                const runData = cache.runs[runId];
                if (runData && runData.length > 0) {
                    message.textContent = 'Нажмите Enter для перехода';
                    message.className = 'message success';
                }
            }
        }

        // Автокомплит
        function showAutocomplete() {
            if (!versions.length) {
                message.textContent = 'Версии не найдены';
                message.className = 'message error';
            }

            const items = versions.map(v => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.textContent = `${currentId} (${v.version}.0)`;
                div.onclick = () => selectVersion(v.version);
                return div;
            });

            const container = document.createElement('div');
            container.className = 'autocomplete-items';
            items.forEach(item => container.appendChild(item));

            autocomplete.innerHTML = '';
            autocomplete.appendChild(container);
        }

        function selectVersion(ver) {
            input.value = `${currentId} (${ver}.0)`;
            autocomplete.innerHTML = '';
            message.textContent = 'Нажмите Enter для перехода';
            message.className = 'message success';
            userEnteredVersion = true;
            input.focus();
        }

        function redirectToMainPage(data) {
            const params = new URLSearchParams();
            params.set('tests', JSON.stringify(data));
            window.location.href = `/main-page.html?${params.toString()}`;
        }

        // История поиска (localStorage)
        function addToHistory(key, ver, type, data) {
            let history = JSON.parse(localStorage.getItem('searchHistory') || '[]');

            // Удаляем дубликаты
            history = history.filter(item => {
                if (type === 'test') {
                    return !(item.key === key && item.version === ver);
                } else {
                    return !(item.key === key && item.type === 'run');
                }
            });

            // Добавляем новый элемент в начало
            const newItem = {
                key,
                ver: ver || null,
                type,
                timestamp: Date.now(),
                label: type === 'test' ? `${key} (${ver}.0)` : key
            };

            history.unshift(newItem);

            // Ограничиваем до 10 элементов
            history = history.slice(0, 10);

            localStorage.setItem('searchHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">История пуста</div>';
                return;
            }

            historyList.innerHTML = '';
            history.sort((i1,i2) => i2.timestamp - t1.timestamp).forEach(item => {
                const div = document.createElement('div');
                let date = new Date(item.timestamp);
                date = [  // "08.10.2025 12:34:56"
                        String(date.getDate()).padStart(2, '0'),
                        String(date.getMonth() + 1).padStart(2, '0'),
                        date.getFullYear()
                    ].join('.') + ' ' + [
                        String(date.getHours()).padStart(2, '0'),
                        String(date.getMinutes()).padStart(2, '0'),
                        String(date.getSeconds()).padStart(2, '0')
                    ].join(':');

                div.className = 'history-item';
                div.textContent = date + '   ' + item.label;
                div.onclick = () => {
                    input.value = item.label;
                    input.dispatchEvent(new Event('input'));
                };
                historyList.appendChild(div);
            });
        }

        // Обработчик Enter
        function handleEnterKey() {
            const value = input.value?.trim().toUpperCase();

            if (!value) return;

            const testWithVersionMatch = value.match(/^(\w+-T\d+)\s+\(?(\d+)\.?0?\)?$/);
            const runMatch = value.match(/^\w+-C\d+$/);

            if (testWithVersionMatch) {
                const testKey = testWithVersionMatch[1];
                const ver = testWithVersionMatch[2];
                const version = versions.find(v => v.version === ver);

                if (version) {
                    addToHistory(testKey, ver, 'test', [version]);
                    redirectToMainPage([version]);
                } else {
                    message.textContent = 'Версия не найдена';
                    message.className = 'message error';
                }
            } else if (runMatch && cache.runs[value]) {
                const runData = cache.runs[value];
                if (runData.length > 0) {
                    addToHistory(value, null, 'run', runData);
                    redirectToMainPage(runData);
                }
            }
        }

        // Инициализация
        input.addEventListener('input', handleInput);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleEnterKey();
            }
        });

        // Слушаем изменения localStorage из других вкладок
        window.addEventListener('storage', (e) => {
            if (e.key === 'searchHistory') {
                renderHistory();
            }
        });

        // Загружаем историю при открытии страницы
        renderHistory();
    </script>
</body>
</html>
