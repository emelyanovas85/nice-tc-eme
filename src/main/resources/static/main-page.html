<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Test System</title>
    <link rel="stylesheet" href="css/banner.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 250px;
            background: #f0f0f0;
            border-right: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
        }
        
        .tab {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            background: white;
            border: 1px solid #ddd;
            cursor: pointer;
            text-align: left;
        }
        
        .tab:hover {
            background: #e9e9e9;
        }
        
        .tab.active {
            background: #007acc;
            color: white;
        }
        
        .tab-left {
            display: flex;
            align-items: center;
            flex: 1;
        }
        
        .tab-status {
            margin-right: 10px;
            font-size: 14px;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tab-spinner {
            margin-left: 10px;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }
        
        .checks-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .check-tile {
            position: relative;
            padding: 15px 20px;
            background: #f8f8f8;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            min-width: 120px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .check-tile:hover {
            background: #e8e8e8;
        }
        
        .check-tile.active {
            border-color: #007acc;
            background: #e6f3ff;
        }
        
        .check-tile-status {
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 14px;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .check-tile-spinner {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 14px;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .prompt-section {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        
        .prompt-header {
            display: flex;
            justify-content: between;
            align-items: center;
            padding: 10px;
            background: #f8f8f8;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            user-select: none;
        }
        
        .prompt-title {
            font-weight: bold;
        }
        
        .collapse-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            margin-left: auto;
        }
        
        .prompt-content {
            padding: 10px;
        }
        
        .prompt-content.collapsed {
            display: none;
        }
        
        .prompt-input {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 10px;
        }
        
        .fields-container {
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .fields-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .field-item {
            display: inline-block;
            padding: 5px 10px;
            margin: 2px;
            background: #007acc;
            color: white;
            border-radius: 3px;
            cursor: grab;
            user-select: none;
        }
        
        .field-item:hover {
            background: #005a9e;
        }
        
        .field-item.selected {
            background: #ff6b35;
        }
        
        .field-item.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        
        .json-viewer {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
        }
        
        .json-viewer-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        
        .json-content {
            background: #2d3748;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            min-height: 0;
            overflow: hidden;
        }
        
        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            min-height: 0;
        }
        
        .chat-input-area {
            border-top: 1px solid #ccc;
            padding: 10px;
            background: #f9f9f9;
        }
        
        .chat-input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .chat-input {
            flex: 1;
            min-height: 40px;
            max-height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
            font-family: inherit;
            overflow-y: auto;
        }
        
        .chat-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .chat-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            min-width: 70px;
        }
        
        .send-btn {
            background: #007acc;
            color: white;
        }
        
        .send-btn:hover:not(:disabled) {
            background: #005a9e;
        }
        
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .stop-btn {
            background: #dc3545;
            color: white;
        }
        
        .stop-btn:hover {
            background: #c82333;
        }
        
        .stop-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .chat-message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
        }
        
        .chat-message.user {
            background: #e3f2fd;
            text-align: right;
        }
        
        .chat-message.system {
            background: #f3e5f5;
        }
        
        .chat-message.comment {
            background: #fff3cd;
            font-style: italic;
            color: #856404;
        }
        
        .chat-message.match {
            background: #d4edda;
            color: #155724;
            font-weight: bold;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        /* Индикаторы статуса */
        .status-success {
            color: #28a745;
        }
        
        .status-error {
            color: #dc3545;
        }
        
        .status-warning {
            color: #ffc107;
        }
        
        .status-processing {
            color: #007bff;
        }
        
        .status-matched {
            color: #28a745;
            font-weight: bold;
        }
        
        /* Спиннер */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Статус подключения SSE */
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
        }
        
        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .connection-status.connecting {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <!-- Баннер -->
    <div id="topBanner">
        <div class="banner-content">
            <div class="banner-text" id="bannerText"></div>
            <button class="banner-close" onclick="hideBanner()" aria-label="Закрыть">&times;</button>
        </div>
    </div>

    <!-- SSE -->
    <div class="connection-status connecting" id="connection-status">Подключение...</div>

    <!-- Контент страницы -->
    <div class="sidebar">
        <div id="tabs-container"></div>
    </div>
    
    <div class="main-content">
        <div id="content-area" class="hidden">
            <div class="checks-container" id="checks-container"></div>
            
            <div id="details-section" class="hidden">
                <div class="prompt-section">
                    <div class="prompt-header">
                        <span class="prompt-title">Настройка промпта</span>
                        <button class="collapse-btn" id="collapse-btn">▼</button>
                    </div>
                    <div class="prompt-content" id="prompt-content">
                        <textarea 
                            id="prompt-input" 
                            class="prompt-input" 
                            placeholder="Введите промпт..."
                        ></textarea>
                        
                        <div class="fields-container">
                            <div class="fields-title">Доступные плейсхолдеры (перетащите в поле выше):</div>
                            <div id="fields-list"></div>
                        </div>
                        
                        <div class="json-viewer">
                            <div class="json-viewer-title">Значение плейсхолдера:</div>
                            <div class="json-content" id="json-content">Выберите плейсхолдер для просмотра его значения</div>
                        </div>
                    </div>
                </div>
                
                <div class="chat-area" id="chat-area">
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-message system">Выберите проверку и введите промпт для начала чата</div>
                    </div>
                    <div class="chat-input-area">
                        <div class="chat-input-container">
                            <textarea 
                                id="chat-input" 
                                class="chat-input" 
                                placeholder="Введите сообщение... (Ctrl+Enter для отправки)"
                                rows="1"
                            ></textarea>
                            <div class="chat-buttons">
                                <button id="send-btn" class="chat-btn send-btn">Отправить</button>
                                <button id="stop-btn" class="chat-btn stop-btn hidden">Остановить</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="app-data-storage" style="display: none;"></div>

    <script src="api/jira.js"></script>
    <script src="api/ai.js"></script>

    <script src="js/banner.js"></script>
    <script src="js/scheduler.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sse.js"></script>
</body>
</html>
