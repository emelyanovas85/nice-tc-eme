# Настройки для разработки
spring.profiles.active=dev

# Основные настройки приложения
spring.application.name=test-system
server.port=8080

# БЕЗ Thymeleaf - только статические ресурсы
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.max-age=0

# Настройки JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Настройки логирования
logging.level.com.testsystem=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Настройки многопоточности
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# Отключаем автоконфигурацию для template engines
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.thymeleaf.ThymeleafAutoConfiguration

# Jira API
jira.base-url=https://jira.company.com
jira.username=
jira.password=
jira.timeout.connection=30000
jira.timeout.read=60000

# AI Service
ai.service.url=https://qwen3-32b-awq.apps.k8s.ehd-zr.cbr.ru/v1
ai.service.api-key=
ai.service.model=qwen3-32b-awq
ai.service.timeout=120000
ai.service.max-tokens=4000

# Настройки безопасности
server.error.include-message=always
server.error.include-binding-errors=always
