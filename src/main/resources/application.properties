# Spring Boot Application Properties \u0434\u043B\u044F MCP Server
# JiraTools MCP Server - Spring AI 1.1.0

# ===== MCP SERVER CONFIGURATION =====
# \u041F\u0440\u043E\u0442\u043E\u043A\u043E\u043B \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u0430 \u0434\u043B\u044F MCP \u0441\u0435\u0440\u0432\u0435\u0440\u0430
# \u041E\u043F\u0446\u0438\u0438: STREAMABLE (HTTP), STDIO (stdin/stdout), SSE (Server-Sent Events)
# STREAMABLE \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0443\u0435\u0442\u0441\u044F \u0434\u043B\u044F \u0438\u043D\u0442\u0435\u0433\u0440\u0430\u0446\u0438\u0438 \u0441 Open WebUI \u0447\u0435\u0440\u0435\u0437 mcpo
spring.ai.mcp.server.protocol=STREAMABLE

# \u0418\u043C\u044F MCP \u0441\u0435\u0440\u0432\u0435\u0440\u0430 (\u0432\u0438\u0434\u0438\u043C\u043E \u043A\u043B\u0438\u0435\u043D\u0442\u0430\u043C)
spring.ai.mcp.server.name=jira-tools-server

# \u0412\u0435\u0440\u0441\u0438\u044F MCP \u0441\u0435\u0440\u0432\u0435\u0440\u0430
spring.ai.mcp.server.version=1.0.0

# \u0411\u0430\u0437\u043E\u0432\u044B\u0439 \u043F\u0443\u0442\u044C \u0434\u043B\u044F MCP \u044D\u043D\u0434\u043F\u043E\u0438\u043D\u0442\u043E\u0432
spring.ai.mcp.server.base-path=/mcp

# \u0421\u0438\u043D\u0445\u0440\u043E\u043D\u043D\u044B\u0439 \u0440\u0435\u0436\u0438\u043C (true \u0434\u043B\u044F STREAMABLE \u0438 SSE)
spring.ai.mcp.server.sync-mode=true

# \u0422\u0430\u0439\u043C\u0430\u0443\u0442\u044B (\u0432 \u043C\u0438\u043B\u043B\u0438\u0441\u0435\u043A\u0443\u043D\u0434\u0430\u0445)
spring.ai.mcp.server.initialization-timeout=10000

# ===== WEB SERVER CONFIGURATION =====
# \u041F\u043E\u0440\u0442 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F
#server.port=8090

# \u041A\u043E\u043D\u0442\u0435\u043A\u0441\u0442\u043D\u044B\u0439 \u043F\u0443\u0442\u044C \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F
server.servlet.context-path=/

# \u0422\u0430\u0439\u043C\u0430\u0443\u0442\u044B Tomcat \u0434\u043B\u044F Streamable HTTP
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=10000

# \u041E\u0442\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 banner \u0434\u043B\u044F \u0447\u0438\u0441\u0442\u043E\u0433\u043E \u0432\u044B\u0432\u043E\u0434\u0430 (\u0435\u0441\u043B\u0438 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442\u0441\u044F \u0432 production)
