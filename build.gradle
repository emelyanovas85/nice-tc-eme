plugins {
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'idea'
}

group = 'at'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    // Spring AI пока в Milestone, поэтому нужен этот репозиторий
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    //bugbusters библиотеки
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation files('libs/JiraClient-1.6.0.jar')
    implementation 'org.apache.commons:commons-text:1.3'
    implementation files('libs/RestClients-1.5.2.jar')

    // Spring Boot Starters (БЕЗ Thymeleaf)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring AI для работы с OpenAI-совместимыми моделями (Qwen через vLLM)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai:1.1.0-M3'
    implementation 'org.springframework.ai:spring-ai-client-chat:1.1.0-M3'

    // Spring Doc (Swagger UI) для документации и тестирования API в браузере
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // HTTP Client для внешних интеграций
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'

    // Annotation Processing
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //bugbusters библиотеки
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation files('libs/JiraClient-1.6.1.jar')
    implementation files('libs/RestClients-1.5.3.jar')

    //flux
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // для Reactor Flux

    //работа с JSON
    implementation 'com.jayway.jsonpath:json-path:2.4.0'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('compileJava') {
    inputs.files(tasks.processResources)
}


// Настройки JAR
tasks.named('jar') {
    enabled = false
}

tasks.named('bootJar') {
    archiveClassifier = ''
    mainClass = 'com.testsystem.TestSystemApplication'
}

// Wrapper настройки  
wrapper {
    gradleVersion = '8.5'
    distributionType = Wrapper.DistributionType.BIN
}
